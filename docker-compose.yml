services:
  mysql:
    image: mysql:8.0
    container_name: ddtm34_aj_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: astreintes_juridiques_new
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s

  php:
    build: ./docker/php
    container_name: ddtm34_aj_php
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: mysql
      DB_NAME: astreintes_juridiques_new
      DB_USER: root
      DB_PASSWORD: root
      AI_URL: http://ai:8000
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_started

  ai:
    build: ./docker/ai
    container_name: ddtm34_aj_ai
    restart: unless-stopped
    volumes:
      - ./docker/ai/app.py:/app/app.py:ro
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

  ollama:
    image: ollama/ollama:latest
    container_name: ddtm34_aj_ollama
    restart: unless-stopped
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  ollama_data:
